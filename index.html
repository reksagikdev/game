<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit', sans-serif;
}

body{
    background-image: url("bg/gambar12.jpg");
    background-position:top;
    min-height:100vh;
    padding:25px;
}

/* CONTAINER */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:28px;
	
}

/* KOLOM */
.kolom{
    background-image: url("bg/gambar2.jpg");
	background-position:right;

    backdrop-filter: blur(12px);

    border:1px solid rgba(255,255,255,0.22);

    border-radius:15px;

    padding:22px;

    display:flex;
    flex-direction:column;

    position:relative;
	scrollbar-color: rgba(100,116,139,0.8) rgba(15,23,42,0.6);
    scrollbar-width: thin;
    
    min-width:0;

    max-height:calc(100vh - 50px);

    overflow-y:auto;
    overflow-x:hidden;

    box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.04),
    0 10px 25px rgba(0,0,0,0.55);
}

.kolom::-webkit-scrollbar{
    width:10px;
}

.kolom::-webkit-scrollbar-track{
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
}

.kolom::-webkit-scrollbar-thumb{
    background: rgba(100, 116, 139, 0.8);
    border-radius: 10px;
    border: 2px solid rgba(15, 23, 42, 0.6);
}

.kolom::-webkit-scrollbar-thumb:hover{
    background: rgba(148, 163, 184, 0.9);
}

/* JUDUL */
.judul{
    position:relative;

    flex:1;

    overflow:hidden;

    padding:8px 20px;

    border-radius:15px;

    text-align:center;

    color:white;

    font-size:20px;
    font-weight:700;
    letter-spacing:1px;

    background-image: url("bg/gambar10.jpg");


    border:1px solid rgba(255,255,255,0.10);

outline:1px solid rgba(147,197,253,0.30);
outline-offset:2px;

box-shadow:
0 10px 35px rgba(0,0,0,0.55),
0 0 0 1px rgba(255,255,255,0.05),
0 0 22px rgba(255,255,255,0.06);

    transition:0.25s ease;
}


/* CARD */
.card{
    position:relative;

    background-image: url("bg/gambar36.jpg");
	background-position:center;

    border:1px solid rgba(255,255,255,0.22);

    border-radius:15px;

    padding:18px;
    margin-bottom:20px;

    display:flex;
    flex-direction:column;
    align-items:center;

    box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.04),
    0 10px 25px rgba(0,0,0,0.55);

    transition:0.2s ease;
}



@keyframes imgShine{
    0%{ left:-60%; }
    100%{ left:140%; }
}

.card:hover{
    

    box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 12px 30px rgba(0,0,0,0.65);
}

/* GAMBAR */
.card img{
    width:auto;
    height:auto;

    max-width:100%;

    object-fit:contain;

    background:#0f172a;
    padding:8px;

    border-radius:15px;
	
	
}

/* BUTTON */
.copyBtn{
    position:relative;

    font-family:'Poppins', sans-serif;
    letter-spacing:0.4px;

    overflow:hidden;

    border:none;

    padding:8px 10px;
    width:90px;

    border-radius:15px;

    
    background:
    linear-gradient(
        145deg,
        #facc15,
        #eab308,
        #ca8a04
    );

    color:#111827;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:0.25s ease;

    
    outline:1px solid rgba(255,255,255,0.18);
    outline-offset:1px;

    
    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 4px 12px rgba(234,179,8,0.28);
}
.copyBtn::before{
    content:"";

    position:absolute;

    top:0;
    left:-75%;

    width:40%;
    height:100%;

    background:
    linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.7),
        transparent
    );

    transform:skewX(-25deg);

    animation:shine 2.5s infinite;
}

/* ANIMASI */
@keyframes shine{

    0%{
        left:-75%;
    }

    100%{
        left:140%;
    }

}

.copyBtn:hover{

    box-shadow:
    0 0 22px rgba(250,204,21,0.50);
}

.copyBtn.success{

    background:
    linear-gradient(135deg,#2563eb,#60a5fa);

    color:white;

    box-shadow:
    0 0 18px rgba(59,130,246,0.45);
}

.buttonGroup{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
	margin-top:12px;
}



.logo-judul{
    width:32px;
    height:32px;
    object-fit:contain;
    flex-shrink:0;
}

.imgBox{
    position:relative;
    overflow:hidden;

    border-radius:15px;

    background: linear-gradient(145deg, #0a0f1f, #0f172a, #111827);

    border:1px solid rgba(59,130,246,0.25);

    padding:8px;
}

/* gambar */
.imgBox img{
    width:100%;
    display:block;
    border-radius:15px;
}

/* shine hanya di dalam gambar */
.imgBox::before{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;

    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
    );

    transform: skewX(-25deg);

}

@keyframes imgShine{
    0%{ left:-60%; }
    100%{ left:140%; }
}


.searchBox{

.searchBox input{

<script>

function copyText(button, text){

    let textarea = document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    document.body.removeChild(textarea);

    let originalText = button.dataset.original;

    if(!originalText){
        originalText = button.innerText;
        button.dataset.original = originalText;
    }

    button.innerText = "✔";

    button.classList.add("success");

    setTimeout(() => {

        button.innerText = originalText;

        button.classList.remove("success");

    },1500);

}


/* SEARCH GAME */
function searchGame(){

    let input = document.getElementById("searchInput").value.toLowerCase().trim();

    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        let game = (card.dataset.game || "").toLowerCase();

        if(input === "" || game.includes(input)){

            card.style.display = "flex";

        }else{

            card.style.display = "none";
        }

    });

}

/* ENTER FIX */
document.addEventListener("DOMContentLoaded", function(){

    document.getElementById("searchInput").addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            searchGame();

        }

    });

});

</script>
